<!DOCTYPE html>
<html lang="{{htmlLang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{metaDesc}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="{{fontLink}}" rel="stylesheet">
<style>
{{css}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>{{title}}</h1>
    <p>{{subtitle}}</p>
    <nav class="langs" aria-label="{{langAria}}">{{langs}}</nav>
  </header>
  <div class="layout">
    <div>
      <div class="card mapcard">
        <svg id="map" role="img" aria-label="{{mapAria}}"></svg>
        <div class="yearbadge" id="badge"></div>
        <div class="zoom"><button id="zin" aria-label="{{zoomIn}}">+</button><button id="zout" aria-label="{{zoomOut}}">−</button><button id="zreset" aria-label="{{zoomReset}}" style="font-size:13px">⤢</button></div>
        <div class="info" id="info"></div>
        <div class="loading" id="loading">{{loading}}</div>
      </div>
      <div class="card" style="margin-top:10px">
        <div class="ctl">
          <button id="prev" aria-label="{{prev}}">‹</button>
          <div class="years" id="years"></div>
          <button id="next" aria-label="{{next}}">›</button>
          <button id="play" aria-label="{{play}}" style="font-size:14px">▶</button>
        </div>
        <div class="legend" id="legend"></div>
        <div class="hint">{{hint}}</div>
      </div>
    </div>
    <aside class="card panel" id="panel"></aside>
  </div>
  <div class="foot">{{footHtml}}</div>
</div>
<script src="lib/d3.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script>
(async function(){
const UI = {{ui}};
const HUE={gb:'red',fr:'blue',es:'yellow',pt:'green',nl:'orange',ru:'violet',ot:'aqua',cn:'magenta',us:'aqua',de:'yellow',at:'magenta',jp:'orange',it:'green',be:'aqua',mg:'orange'};
const col=k=>`var(--c-${HUE[k]})`;
const fmt=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]);
const [content, meta] = await Promise.all([fetch('content.json').then(r=>r.json()), fetch('meta.json').then(r=>r.json())]);
function shortName(k,y){ const L=content.short[k]; if(!L) return k; for(const [until,label] of L) if(y<until) return label; return L[L.length-1][1]; }
const YEARS = content.years.map(d=>d.year);
const byYear = Object.fromEntries(content.years.map(d=>[d.year,d]));
const cache = {};
// 뒤집힌 고리(지구 전체를 덮는 폴리곤)를 바로잡는다
function rewind(f){
  const gm=f.geometry; if(!gm) return f;
  const polys=gm.type==='Polygon'?[gm.coordinates]:gm.type==='MultiPolygon'?gm.coordinates:[];
  for(const poly of polys){ for(let i=0;i<poly.length;i++){ const ring={type:'Polygon',coordinates:[poly[i]]}; if(d3.geoArea(ring)>2*Math.PI) poly[i]=poly[i].slice().reverse(); } }
  return f;
}
const load = y => cache[y] ||= fetch(`data/${y}.json`).then(r=>r.json()).then(t=>topojson.feature(t,t.objects.w).features.map(rewind).filter(f=>f.geometry));

// ---- map setup
const W=960,H=500;
const svg=d3.select('#map').attr('viewBox',`0 0 ${W} ${H}`);
const proj=d3.geoNaturalEarth1().fitExtent([[6,6],[W-6,H-6]],{type:'Sphere'});
const path=d3.geoPath(proj);
const g=svg.append('g');
g.append('path').attr('class','sphere').attr('d',path({type:'Sphere'}));
g.append('path').attr('class','grat').attr('d',path(d3.geoGraticule10()));
const gPoly=g.append('g'), gCk=g.append('g'), gLbl=g.append('g');
let ckOn=true;
const MK=()=>document.getElementById('map').clientWidth<640?2:1;
let k=1;
const LBL=()=>document.getElementById('map').clientWidth<640?24:13;
const zoom=d3.zoom().scaleExtent([1,12]).translateExtent([[0,0],[W,H]]).on('zoom',e=>{k=e.transform.k;g.attr('transform',e.transform);gLbl.selectAll('text').attr('font-size',LBL()/Math.sqrt(k)).style('stroke-width',3/k+'px');gCk.selectAll('g.inner').attr('transform',`scale(${MK()/k})`);});
svg.call(zoom).on('dblclick.zoom',null);
d3.select('#zin').on('click',()=>svg.transition().duration(300).call(zoom.scaleBy,1.6));
d3.select('#zout').on('click',()=>svg.transition().duration(300).call(zoom.scaleBy,1/1.6));
d3.select('#zreset').on('click',()=>svg.transition().duration(400).call(zoom.transform,d3.zoomIdentity));

// ---- state
let year=YEARS[0], tab='power', focus=null, timer=null, selEl=null;
const h=(location.hash||'').match(/^#y(\d{4})$/); if(h&&byYear[+h[1]]) year=+h[1];
const info=document.getElementById('info');
const fixText=id=>content.fixes[id]||'';

function fill(d,rivals){
  const p=d.properties.p;
  if(p && rivals.includes(p)) return (focus && focus!==p) ? 'var(--land)' : col(p);
  return d.properties.n ? 'var(--land)' : 'var(--land0)';
}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function closeBtn(){return `<button class="x" aria-label="${esc(UI.close)}">×</button>`;}
function showInfo(d){
  const p=d.properties, prec=UI.precVals[p.b-1]||UI.noInfo;
  info.innerHTML=closeBtn()+`<b>${esc(p.n||UI.unnamed)}</b>`+
    `<div class="meta">${p.s?esc(UI.srcSubj)+': '+esc(p.s)+' · ':''}${p.p?esc(UI.cls)+': '+esc(shortName(p.p,year))+' · ':''}${esc(UI.prec)}: ${esc(prec)}</div>`+
    (p.f?`<div class="fix">${esc(UI.fix)}: ${esc(fixText(p.f))}</div>`:'');
  info.style.display='block';
  info.querySelector('.x').onclick=()=>{info.style.display='none';if(selEl)selEl.classList.remove('sel');};
}
const ckList=()=>meta.choke[year].map(c=>({...c,...content.choke[c.id][year]}));
function ckColor(c){return c.k&&byYear[year].rivals.includes(c.k)?col(c.k):'var(--ink2)';}
function showCk(c){
  const mapLabel=c.absent?esc(UI.ckMapNone):`‘${esc(c.mapName||UI.unnamed)}’(${esc(c.mapKey?shortName(c.mapKey,year):UI.otherPower)})`;
  info.innerHTML=closeBtn()+`<b>◆ ${esc(c.name)}</b>`+
   `<div>${esc(fmt(UI.ckRuler,{year}))} <b style="font-size:13px">${esc(c.who)}</b></div>`+
   (c.note?`<div class="meta">${esc(c.note)}</div>`:'')+
   (c.absent?`<div class="meta">${esc(UI.ckAbsentLong)}</div>`:'')+
   (c.vis?`<div class="warn">${esc(UI.ckDiffLong).replace('{map}',mapLabel)}</div>`:'');
  info.style.display='block';
  info.querySelector('.x').onclick=()=>{info.style.display='none';};
}
function drawCk(){
  const list=ckOn?ckList():[];
  const sel=gCk.selectAll('g.ck').data(list,c=>c.id).join(en=>{const a=en.append('g').attr('class','ck');const i=a.append('g').attr('class','inner');i.append('circle').attr('class','hit').attr('r',9);i.append('circle').attr('class','ring').attr('r',7);i.append('path').attr('class','dia').attr('d','M0,-4.6L4.6,0L0,4.6L-4.6,0Z');return a;});
  sel.attr('transform',c=>`translate(${proj(c.ll)})`).on('click',(e,c)=>{e.stopPropagation();if(selEl)selEl.classList.remove('sel');showCk(c);});
  sel.select('g.inner').attr('transform',`scale(${MK()/k})`);
  sel.select('.dia').attr('fill',ckColor);
  sel.select('.ring').attr('display',c=>c.vis?null:'none');
}
async function drawMap(){
  const feats=await load(year); document.getElementById('loading').style.display='none';
  const c=byYear[year], rivals=c.rivals;
  gPoly.selectAll('path').data(feats,(d,i)=>year+'-'+i).join('path')
    .attr('class','poly').attr('d',path).attr('fill',d=>fill(d,rivals))
    .on('click',function(e,d){ if(selEl) selEl.classList.remove('sel'); selEl=this; this.classList.add('sel'); showInfo(d); });
  const L=meta.labels[year]||{};
  gLbl.selectAll('text').data(rivals.filter(r=>L[r]),r=>r).join('text').attr('class','lbl')
    .attr('x',r=>proj(L[r])[0]).attr('y',r=>proj(L[r])[1]).attr('font-size',LBL()/Math.sqrt(k)).style('stroke-width',3/k+'px')
    .attr('opacity',r=>focus&&focus!==r?.25:1).text(r=>shortName(r,year));
  const placed=[]; gLbl.selectAll('text').each(function(r){ let [x,y]=proj(L[r]); for(let n=0;n<4&&placed.some(([a,b])=>Math.abs(a-x)<LBL()*3.6&&Math.abs(b-y)<LBL());n++) y+=LBL()*1.1; placed.push([x,y]); d3.select(this).attr('y',y); });
  drawCk();
  document.getElementById('badge').textContent=year;
  const i=YEARS.indexOf(year); [YEARS[i+1],YEARS[i-1]].forEach(y=>y&&load(y));
}
function recolor(){
  const rivals=byYear[year].rivals;
  gPoly.selectAll('path').attr('fill',d=>fill(d,rivals));
  gLbl.selectAll('text').attr('opacity',r=>focus&&focus!==r?.25:1);
  renderLegend(); drawCk();
}
function renderYears(){
  const box=document.getElementById('years');
  box.innerHTML=YEARS.map(y=>`<button data-y="${y}" class="${y===year?'on':''}">${y}</button>`).join('');
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>setYear(+b.dataset.y));
  const on=box.querySelector('.on'); if(on) on.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
}
function renderLegend(){
  const c=byYear[year];
  const el=document.getElementById('legend');
  el.innerHTML=c.rivals.map(r=>`<button class="chip ${focus&&focus!==r?'dim':''}" data-k="${r}" aria-pressed="${focus===r}"><i style="background:${col(r)}"></i>${esc(shortName(r,year))}</button>`).join('')+
    `<span class="chip neutral" style="cursor:default"><i></i>${esc(UI.others)}</span>`+
    `<button class="chip ${ckOn?'':'dim'}" id="cktog" aria-pressed="${ckOn}"><span style="font-size:12px">◆</span>${esc(ckOn?UI.ckShown:UI.ckHidden)}</button>`;
  el.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{focus=focus===b.dataset.k?null:b.dataset.k;recolor();});
  document.getElementById('cktog').onclick=()=>{ckOn=!ckOn;renderLegend();drawCk();};
}
const TABS=['power','events','tech','ideas'];
function ckSection(){
  const L=ckList(), bad=L.filter(c=>c.vis);
  const ord=[...bad,...L.filter(c=>!c.vis)];
  return `<div class="note"><h4>${esc(fmt(UI.ckTitle,{n:L.length}))}${esc(bad.length?fmt(UI.ckTitleDiff,{m:bad.length}):UI.ckTitleOk)}</h4><ul class="cklist">`+
   ord.map(c=>`<li data-id="${c.id}"><span class="d" style="background:${ckColor(c)}"></span><span><b>${esc(c.name)}</b> — ${esc(c.who)}${c.vis?` <span class="warn">${esc(UI.ckDiff)}</span>`:''}${c.absent?` <span style="color:var(--muted)">${esc(UI.ckAbsent)}</span>`:''}${c.note?`<br><span style="color:var(--muted)">${esc(c.note)}</span>`:''}</span></li>`).join('')+`</ul></div>`;
}
function renderPanel(){
  const c=byYear[year], i=YEARS.indexOf(year), prevY=YEARS[i-1];
  const fixes=Object.entries(meta.fixes[year]||{});
  const groups=[...new Set(fixes.map(([,f])=>f))].map(f=>[f,fixes.filter(x=>x[1]===f).map(x=>x[0])]);
  let body='';
  if(tab==='events') body=c.events.map(e=>`<div class="ev"><h3>${esc(e.t)}</h3><div class="row"><span class="tag g">${esc(UI.gain)}</span><span>${esc(e.g)}</span></div><div class="row"><span class="tag l">${esc(UI.loss)}</span><span>${esc(e.l)}</span></div></div>`).join('');
  else body=`<ul class="pts">${c[tab].map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;
  document.getElementById('panel').innerHTML=
    `<div class="era">${esc(prevY?fmt(UI.era,{prev:prevY,year}):fmt(UI.eraFirst,{year}))}</div><h2>${esc(c.title)}</h2>`+
    `<div class="tabs" role="tablist">${TABS.map((k2,j)=>`<button role="tab" data-t="${k2}" class="${tab===k2?'on':''}" aria-selected="${tab===k2}">${esc(UI.tabs[j])}</button>`).join('')}</div>`+
    body+
    `<div class="note"><h4>${esc(UI.readMore)}</h4><div class="links">${c.links.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`).join('')}</div></div>`+
    ckSection()+
    (groups.length?`<div class="note"><h4>${esc(UI.fixesTitle)}</h4><ul>${groups.map(([f,ns])=>`<li>${esc(fixText(f))} — <span style="color:var(--muted)">${esc(ns.slice(0,8).join(', '))}${ns.length>8?esc(fmt(UI.andMore,{n:ns.length-8})):''}</span></li>`).join('')}</ul></div>`:'');
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;renderPanel();});
  document.querySelectorAll('.cklist li').forEach(li=>li.onclick=()=>{const c=ckList().find(x=>x.id===li.dataset.id);showCk(c);const [x,y2]=proj(c.ll);svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity.translate(W/2,H/2).scale(4).translate(-x,-y2));document.querySelector('.mapcard').scrollIntoView({behavior:'smooth',block:'nearest'});});
}
async function setYear(y){
  year=y; focus=null; info.style.display='none'; selEl=null;
  try{ if(location.hash!=='#y'+y) history.replaceState(null,'','#y'+y);}catch(e){}
  renderYears(); renderLegend(); renderPanel(); await drawMap();
}
const step=dlt=>{const i=YEARS.indexOf(year)+dlt; if(i>=0&&i<YEARS.length) setYear(YEARS[i]);};
document.getElementById('prev').onclick=()=>step(-1);
document.getElementById('next').onclick=()=>step(1);
document.getElementById('play').onclick=function(){
  if(timer){clearInterval(timer);timer=null;this.textContent='▶';return;}
  this.textContent='❚❚'; if(year===YEARS[YEARS.length-1]) setYear(YEARS[0]);
  timer=setInterval(()=>{ if(year===YEARS[YEARS.length-1]){clearInterval(timer);timer=null;document.getElementById('play').textContent='▶';return;} step(1);},3200);
};
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);});
window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#y(\d{4})$/);if(m&&byYear[+m[1]]&&+m[1]!==year)setYear(+m[1]);});
setYear(year);
})();
</script>
</body>
</html>
